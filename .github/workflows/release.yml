name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HeoMusic Android ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: HeoMusic.apk
          draft: false
          prerelease: false
